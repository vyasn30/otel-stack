apiVersion: 1
providers:
  - name: 'otel-hostmetrics'
    orgId: 1
    folder: 'OTel'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true          # dashboards stay editable in the UI
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
