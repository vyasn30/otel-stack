server:
  http_listen_port: 3200          # query API; Grafana talks to this

distributor:
  receivers:                      # Tempo speaks OTLP natively
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m          # flush to storage often, so traces appear fast

compactor:
  compaction:
    block_retention: 48h          # local playground: keep 2 days

storage:
  trace:
    backend: local                # swap to s3/gcs in a real deployment
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
