services:
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yaml   # image default is .yml; point it at our .yaml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro   # mounted, not baked
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    ports:
      - "3300:3000"   # host 3000 is taken by node-ping (pid 1921); container port unchanged
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  tempo:
      image: grafana/tempo:2.7.1
      container_name: tempo
      command: ["-config.file=/etc/tempo/tempo.yaml"]
      ports:
        - "3200:3200"        # query API — Grafana talks to this
        - "14317:4317"       # OTLP gRPC  (host 4317 belongs to the collector)
        - "14318:4318"       # OTLP HTTP  (host 4318 likewise)
      volumes:
        - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
        - tempo-data:/var/tempo
      restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    ports:
      - "16686:16686"      # UI
      - "24317:4317"       # OTLP gRPC (4317=collector, 14317=tempo already taken)
      - "24318:4318"       # OTLP HTTP
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.48.0/20   # pinned so the ufw rule for :8889 stays valid
