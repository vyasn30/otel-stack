# OpenTelemetry Collector configuration for the otel-stack playground.
#
# Installed to /etc/otelcol/config.yaml by install-otelcol-obi.sh when
# WRITE_COLLECTOR_CONFIG=true. Keep this file as the source of truth and
# re-run the script rather than editing /etc/otelcol/config.yaml directly.
#
# The trace backends default to the docker-compose stack on this host. Point
# them elsewhere without editing this file by setting, in
# /etc/otelcol/otelcol.conf (read by the systemd unit as an EnvironmentFile):
#   TEMPO_OTLP_ENDPOINT=tempo.example:4317
#   JAEGER_OTLP_ENDPOINT=jaeger.example:4317
#
# To limit exposure to denial of service attacks, change the host in endpoints below from 0.0.0.0 to a specific network interface.
# See https://github.com/open-telemetry/opentelemetry-collector/blob/main/docs/security-best-practices.md#safeguards-against-denial-of-service-attacks

extensions:
  health_check:
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  # Collect own metrics
  prometheus:
    config:
      scrape_configs:
      - job_name: 'otel-collector'
        scrape_interval: 10s
        static_configs:
        - targets: ['0.0.0.0:8888']

  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_http:
        endpoint: 0.0.0.0:14268

  zipkin:
    endpoint: 0.0.0.0:9411
  
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      load:
      network:

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  prometheus:
    endpoint: 0.0.0.0:8889    

  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT:-localhost:14317}
    tls:
      insecure: true

  otlp/jaeger:
    endpoint: ${env:JAEGER_OTLP_ENDPOINT:-localhost:24317}
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '127.0.0.1'
                port: 8888
                without_scope_info: true
                without_type_suffix: true
                without_units: true
                with_resource_constant_labels:
                  included: [ ]

  pipelines:

    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [batch]
      exporters: [otlp/tempo, otlp/jaeger]

    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors: [batch]
      exporters: [debug, prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

  extensions: [health_check, pprof, zpages]
